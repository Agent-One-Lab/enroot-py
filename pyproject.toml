[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enroot-py"
version = "0.1.0"
description = "A Python client for Enroot"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" } # Assuming MIT license, based on common practice for open source projects
keywords = ["enroot", "container", "nvidia", "client"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
]

